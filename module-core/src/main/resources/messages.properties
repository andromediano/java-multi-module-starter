sms.message.verification=요청하신 인증번호[%s]를 입력해 주세요.
sms.message.forgot.id=요청하신 회원님의 아이디는 [%s]입니다.
sms.message.forgot.password=요청하신 회원님의 임시비밀번호는 [%s]입니다.
sms.message.regist.manager=관리자로 등록 되었습니다. 임시비밀번호는 [%s]입니다.
sms.message.survey.approved=참여신청하신 [%s, %s]의 %s가 승인되었습니다.\n신청하신 목록을 확인하시면 제품의 설문(테스트) 방법에 대한 정보가 기입되어 있습니다. 제품(SW)을 사용(확인)해보시고 설문기간 동안에 성실히 테스트를 완료해주시면 됩니다. 참여를 해주신것에 대해 다시한번 감사드립니다.
sms.message.survey.hold=참여신청하신 [%s, %s]의 %s가 예비후보로 등록 되었습니다.\n설문기간안에 테스트를 진행하지 않는 분이 발생할 경우에 순차적으로 승인처리되어 제품 사용 및 테스트에 참여하실수 있음을 알려드립니다.
sms.message.survey.rejected=참여신청하신 [%s, %s]의 %s가 반려 처리되었습니다.\n참여자가 많아 부득이하게 참여순서 및 테스트 요건 등을 검토하게 된 점 양해를 부탁드립니다. 많은 관심에 감사드리며, 추후 더 좋은 기회를 통해 찾아뵐 수 있도록 하겠습니다.

