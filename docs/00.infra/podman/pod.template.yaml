apiVersion: v1
kind: Pod
metadata:
  name: module-pod
  labels:
    app: module
spec:
  containers:
  #
  # POSTGRES
  #
  - name: postgres
    image: docker.io/library/postgres:18-bookworm
    env:
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef:
          name: module-secret
          key: postgres-user
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: module-secret
          key: postgres-password
    - name: POSTGRES_DB
      valueFrom:
        secretKeyRef:
          name: module-secret
          key: postgres-db
    ports:
    - containerPort: 5432
      hostPort: 55432
    volumeMounts:
    - name: postgres-data
      mountPath: /var/lib/postgresql
  #
  # Redis
  #
  - name: redis
    image: docker.io/library/redis:8-alpine
    ports:
    - containerPort: 6379
      hostPort: 56379
    volumeMounts:
    - name: redis-data
      mountPath: /data
  #
  # Neo4j
  #
  - name: neo4j
    image: docker.io/library/neo4j:5-community
    env:
    - name: NEO4J_AUTH
      valueFrom:
        secretKeyRef:
          name: module-secret
          key: neo4j-auth
    - name: NEO4J_PLUGINS
      value: '["apoc"]'
    - name: NEO4J_server_memory_heap_initial__size
      value: 512m
    - name: NEO4J_server_memory_heap_max__size
      value: 1G
    - name: NEO4J_server_memory_pagecache_size
      value: 512m
    ports:
    - containerPort: 7474
      hostPort: 57474
    - containerPort: 7687
      hostPort: 57687
    volumeMounts:
    - name: neo4j-data
      mountPath: /data
    - name: neo4j-logs
      mountPath: /logs
  #
  # VOLUMES
  #
  volumes:
  - name: postgres-data
    emptyDir: {}
  - name: redis-data
    emptyDir: {}
  - name: neo4j-data
    emptyDir: {}
  - name: neo4j-logs
    emptyDir: {}
