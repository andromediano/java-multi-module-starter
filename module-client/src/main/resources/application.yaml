server:
  port: 8080

spring:
  application:
    name: module-client
  profiles:
    default: local
  security:
    oauth2:
      client:
        registration:
          mvptest-auth:
            client-id: mvptest-client
            client-secret: ${OAUTH_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
            client-name: mvptest Authorization Server
        provider:
          mvptest-auth:
            issuer-uri: ${AUTH_ISSUER_URI}

---

# Local
spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      client:
        registration:
          mvptest-auth:
            client-secret: secret
        provider:
          mvptest-auth:
            issuer-uri: http://localhost:9000
  thymeleaf:
    cache: false

logging:
  level:
    org.springframework.security: DEBUG
