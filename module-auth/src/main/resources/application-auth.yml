server:
  port: 9000

spring:
  application:
    name: mvptest-auth

  datasource:
    url: jdbc:postgresql://localhost:5432/mvptest
    username: mvptest
    password: mvptest
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

logging:
  level:
    org.springframework.security: DEBUG
