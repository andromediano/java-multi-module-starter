server:
  port: 8090

spring:
  application:
    name: module-api
  profiles:
    default: local
  config:
    import:
      - classpath:core.yaml
      - classpath:domain.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI}

---

# Local
spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

logging:
  level:
    org.springframework.security: DEBUG
