server:
  port: 8090

spring:
  application:
    name: mvptest-api

  datasource:
    url: jdbc:postgresql://localhost:5432/mvptest
    username: mvptest
    password: mvptest
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

logging:
  level:
    org.springframework.security: DEBUG
